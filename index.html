<style>
/* Layout: a prompter stage with a fixed reading line, set like a printed playtext.
   Andrew argues for Coen, so his lines are silver. Shourya argues for Polanski, so his are in colour. */
:root {
  color-scheme: dark;
  --bg: #111317;
  --panel: #191c22;
  --line: #333844;
  --fg: #e9ebef;
  --muted: #a2a8b5;
  --andrew: #dfe6f2;
  --shourya: #f0a868;
  --ok: #7fd1a0;
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --size: 32px;
  --read: 30%;
}
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px;
}
.frame { position: relative; flex: 1; min-height: 0; }
#stage {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#script { max-width: 62rem; margin-inline: auto; font-family: var(--font-body); }
.head { display: grid; gap: 6px; padding-block: 24px; }
.head h1 { margin: 0; font: 400 clamp(28px, 5vw, 44px)/1.1 var(--font-display); text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font: 400 16px/1.4 var(--font-ui); }
.section-head {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
  padding-block: 40px 20px; font-family: var(--font-display); color: var(--muted);
}
.section-head h2 { margin: 0; font: italic 400 calc(var(--size) * 1.05)/1.2 var(--font-display); color: var(--fg); text-wrap: balance; }
.section-head span { font: 400 15px/1.2 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.line {
  display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 16px;
  padding-block: calc(var(--size) * .42); cursor: pointer; opacity: .82; transition: opacity .25s;
}
.who {
  padding-top: calc(var(--size) * .3); font: 600 14px/1 var(--font-ui);
  letter-spacing: .12em; text-transform: uppercase; text-align: right;
}
.text { font-size: var(--size); line-height: 1.42; min-width: 0; overflow-wrap: anywhere; }
.text em { color: var(--muted); }
.andrew { color: var(--andrew); }
.shourya { color: var(--shourya); }
.line.now { opacity: 1; }
[data-focus="andrew"] .line.shourya, [data-focus="shourya"] .line.andrew { opacity: .3; }
[data-focus="andrew"] .line.andrew, [data-focus="shourya"] .line.shourya { opacity: .84; }
[data-focus="andrew"] .line.andrew.now, [data-focus="shourya"] .line.shourya.now { opacity: 1; }
.end { padding-block: 40px; font: italic 400 24px/1.3 var(--font-display); color: var(--muted); }

.shade { position: absolute; inset-inline: 0; pointer-events: none; }
.shade.top { top: 0; height: 12%; background: linear-gradient(var(--bg), transparent); }
.shade.bottom { bottom: 0; height: 8%; background: linear-gradient(transparent, var(--bg)); }
#mark {
  position: absolute; inset-inline: 0; top: var(--read); height: 0; pointer-events: none;
  border-top: 1px solid var(--line); color: var(--muted);
}
#mark::before {
  content: ""; position: absolute; left: 0; top: -7px;
  border-block: 7px solid transparent; border-left: 11px solid currentColor;
}

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px; background: var(--panel); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.label { color: var(--muted); }
button, select {
  min-height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 400 15px var(--font-ui); cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--shourya); outline-offset: 2px; }
#play { min-width: 76px; font-weight: 600; background: var(--fg); color: var(--bg); border-color: var(--fg); }
#section { max-width: 11rem; }
.seg { display: flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button[aria-pressed="true"] { background: var(--line); border-color: var(--muted); position: relative; }
#speed { width: 110px; accent-color: var(--shourya); }
#speedOut {
  width: 4.2em; min-height: 40px; padding-inline: 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 400 15px var(--font-ui); font-variant-numeric: tabular-nums;
}
#sync.on { border-color: var(--ok); color: var(--ok); }
#syncPanel {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 2;
  width: min(22rem, calc(100% - 32px)); display: grid; gap: 10px; padding: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
#syncPanel h2 { margin: 0; font: 600 16px/1.2 var(--font-ui); }
#syncPanel p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
#syncPanel .row { display: flex; flex-wrap: wrap; gap: 8px; }
#roomCode {
  flex: 1; min-width: 7rem; min-height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 600 18px var(--font-ui); letter-spacing: .12em; text-transform: uppercase;
}
#syncStatus { color: var(--fg); }
.clock { margin-left: auto; display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#clock { font-size: 20px; font-weight: 600; }
#speaker { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }

@media (max-width: 640px) {
  .line { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .who { text-align: left; padding-top: 0; }
  .bar { gap: 8px 12px; padding-block: 8px; }
  #section { max-width: 11rem; }
  .only-wide { display: none; }
  #speed { width: 84px; }
}
@media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>

<body>
<div class="frame">
  <div id="stage">
    <div id="script" data-focus="both">
      <header class="head" id="head">
        <h1>The Foul Fair Podcast</h1>
        <p>Lady Macbeth in Polanski (1971) and Coen (2021). Click any line to jump there.</p>
      </header>
      <div id="body"></div>
      <p class="end">End of episode.</p>
    </div>
  </div>
  <div class="shade top"></div>
  <div class="shade bottom"></div>
  <div id="mark"></div>
  <div id="syncPanel" hidden>
    <h2>Sync two devices</h2>
    <p>Enter the same code on both devices. Speed, play, pause and position will match.</p>
    <form class="row" id="syncForm">
      <input id="roomCode" aria-label="Room code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="join" type="submit">Join</button>
    </form>
    <p id="syncStatus" role="status">Not synced.</p>
    <div class="row">
      <button id="copyLink" type="button" hidden>Copy link</button>
      <button id="leave" type="button" hidden>Leave</button>
      <button id="closeSync" type="button">Close</button>
    </div>
  </div>
</div>

<div class="bar">
  <div class="group">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <button id="sync" type="button" aria-expanded="false">Sync</button>
  </div>
  <div class="group">
    <label class="label" for="speed">Speed</label>
    <input id="speed" type="range" min="50" max="150" step="1" value="100">
    <input id="speedOut" type="number" inputmode="numeric" min="10" max="300" step="1" value="100" aria-label="Speed in percent"><span class="label">%</span>
  </div>
  <div class="group">
    <span class="label only-wide">Text</span>
    <button id="smaller" type="button" aria-label="Make text smaller">A−</button>
    <button id="larger" type="button" aria-label="Make text larger">A+</button>
  </div>
  <div class="group">
    <span class="label only-wide">Highlight</span>
    <div class="seg" id="focus" role="group" aria-label="Highlight a speaker">
      <button type="button" data-focus="both" aria-pressed="true">Both</button>
      <button type="button" data-focus="andrew" aria-pressed="false">Andrew</button>
      <button type="button" data-focus="shourya" aria-pressed="false">Shourya</button>
    </div>
  </div>
  <div class="group">
    <select id="section" aria-label="Jump to section"></select>
  </div>
  <div class="clock">
    <span id="speaker"></span>
    <span id="clock" aria-live="off">0:00</span>
    <span class="label">/ <span id="total"></span></span>
  </div>
</div>

<script>
const SECTIONS = [{"title": "Cold open and intro", "start": 0, "end": 120, "lines": [{"who": "Shourya", "text": "Before we get going, one fast question. If you were casting Lady Macbeth, would you pick someone young or someone older?"}, {"who": "Andrew", "text": "Older, no question. A woman who’s spent decades waiting for this moment."}, {"who": "Shourya", "text": "I would’ve gone younger, and honestly, that disagreement is this entire episode."}, {"who": "Andrew", "text": "(laughs) Maybe we should tell people who we are?"}, {"who": "Shourya", "text": "Good idea. Thanks for joining us, I’m Shourya."}, {"who": "Andrew", "text": "And I’m Andrew, and this is the Foul Fair Podcast. In this episode, we’re putting two Macbeth films head to head: Roman Polanski’s 1971 version and Joel Coen’s The Tragedy of Macbeth from 2021."}, {"who": "Shourya", "text": "Our focus is a single character, Lady Macbeth, and mostly a single scene, Act 1, Scene 5. That’s when she reads Macbeth’s letter about the witches and asks the spirits to strip away her womanhood."}, {"who": "Andrew", "text": "Yeah, and the thing we keep returning to is whether she’s convincing. In each film, do her reasons hold up?"}, {"who": "Shourya", "text": "The two directors take very different risks here. Polanski goes with Francesca Annis, who’s in her twenties. She’s youthful and beautiful, she seems nearly innocent, and she’s secretly pulling all the strings."}, {"who": "Andrew", "text": "Coen goes with Frances McDormand, who’s in her sixties. She’s more mature, more icy, and frankly a little worn out. It’s the same character name, but a completely different person."}, {"who": "Shourya", "text": "So we’ll begin with the play, move through each film, and then argue over which one better matches what Shakespeare intended."}, {"who": "Andrew", "text": "Mostly the arguing."}]}, {"title": "What Shakespeare gives us", "start": 120, "end": 300, "lines": [{"who": "Andrew", "text": "Let’s start with the text. What do we actually learn about her in Act 1, Scene 5?"}, {"who": "Shourya", "text": "Very little about her reasons, to be honest. She reads the letter, and instead of celebrating, she starts worrying about her husband. She thinks he’s too kind to take the quick path to the crown."}, {"who": "Andrew", "text": "That’s a compliment and an insult at the same time."}, {"who": "Shourya", "text": "Exactly. She’s already decided they’re killing Duncan. She just doesn’t know if Macbeth can go through with it."}, {"who": "Andrew", "text": "Then a messenger says Duncan is coming that night, and she immediately starts talking about a raven announcing his death at her castle. And she says her castle, not their castle."}, {"who": "Shourya", "text": "Good catch. Then comes the famous part. She asks the spirits to take away her womanhood and fill her completely with cruelty."}, {"who": "Andrew", "text": "What’s interesting to me is that she has to ask for it. If she’s asking to become evil, she isn’t evil yet. You don’t ask for something you already have."}, {"who": "Shourya", "text": "Right, and that’s a big deal for this episode. Shakespeare shows us her ambition but never explains where it comes from. So each director has to answer that, and their answer decides whether we believe her."}, {"who": "Andrew", "text": "They also have to prepare us for Act 5. At the start she wants darkness to hide the knife, and by the end she’s sleepwalking and trying to wash off blood that isn’t there."}, {"who": "Shourya", "text": "So 1.5 has to show a small weakness in her, or that later breakdown comes out of nowhere."}, {"who": "Andrew", "text": "There’s one more moment to point out, in Act 2, Scene 2. She says she would’ve killed Duncan herself, but he looked too much like her father while he was asleep. So in the end, she can’t do it."}, {"who": "Shourya", "text": "So she isn’t as cold as she wants to be. Remember that, because the two films handle it very differently."}]}, {"title": "Polanski’s Lady Macbeth, 1971", "start": 300, "end": 540, "lines": [{"who": "Shourya", "text": "Let’s begin with Polanski, and I want to start with a fact that explains a lot. Annis was only 26 when they filmed this, and that was on purpose. Polanski wanted his Macbeths young and good-looking because he thought younger audiences would connect with them."}, {"who": "Andrew", "text": "So he’s casting for the audience as much as the character."}, {"who": "Shourya", "text": "Exactly. And the look of the film follows the same idea. He shot in Wales and northern England, at real castles and on real beaches. You get color, mud, animals, and natural sunlight."}, {"who": "Andrew", "text": "It feels like you’re really in the Middle Ages, not watching a play."}, {"who": "Shourya", "text": "That matters in 1.5. Annis reads the letter alone in a stone room, in soft natural light, with animals around her. She could be any young wife hearing good news."}, {"who": "Andrew", "text": "That’s the part that stuck with me. The mise-en-scene feels warm and cozy, but she’s talking about murder. She tells Macbeth to look as innocent as a flower and be the snake underneath it, and that’s what the whole scene is doing."}, {"who": "Shourya", "text": "Hold on, I like that. For Polanski, the setting is the innocent flower. And it tricks us too. We relax, we decide she’s harmless, and then we hear what she’s actually planning."}, {"who": "Andrew", "text": "His wide shots help too. They show her in this comfortable space, which makes her dark plans stand out even more."}, {"who": "Shourya", "text": "So do we believe her? I think we do, in a specific way. Picture someone in her twenties who has only ever imagined power. To her, murder is just a plan. She has no idea what it will do to her. That’s what Annis plays: ambition without experience."}, {"who": "Andrew", "text": "Yeah, when she calls on the spirits, she doesn’t sound like a witch. She sounds like someone giving herself a pep talk."}, {"who": "Shourya", "text": "Which leads to the payoff. Polanski adds something the play doesn’t show. In Shakespeare, Duncan’s murder happens offstage, and we only hear about it. Polanski makes us watch, and it’s brutal."}, {"who": "Andrew", "text": "For some context, Polanski made this film soon after his wife, Sharon Tate, was murdered in 1969. Many critics connect the film’s violence to that."}, {"who": "Shourya", "text": "Whatever the reason, the film never lets violence look clean, and that’s why her story works. When Annis’s Lady Macbeth sees what they’ve really done, her innocence starts to break. In the sleepwalking scene, she’s like a child who knows she’s broken something she can’t fix."}, {"who": "Andrew", "text": "I’d push back a little, though. Sometimes her innocence makes her hard to believe in the role. In the play, she talks about killing her own baby to prove how determined she is. It’s hard to imagine someone this gentle saying that."}, {"who": "Shourya", "text": "I think that’s on purpose. In Polanski’s version, her ambition is bigger than her understanding of violence. Think of her saying that line the way someone says the most shocking thing they can think of to win an argument. She doesn’t know yet what those words really mean."}, {"who": "Andrew", "text": "Okay, I’ll give you that. I still want more danger from her, though."}, {"who": "Shourya", "text": "That’s fair. Her gentle look can make it hard to see the powerful manipulator Shakespeare wrote. One last thing before we move on. Polanski changes the ending too. Right when order seems restored, he links Malcolm’s brother, Donalbain, to the witches. It suggests the violence is about to start all over, and it makes Lady Macbeth feel like one more person this world destroyed."}]}, {"title": "Coen’s Lady Macbeth, 2021", "start": 540, "end": 780, "lines": [{"who": "Andrew", "text": "All right, I’ll take this one. Coen goes in the opposite direction visually. It’s black and white, almost square in the old 1.37:1 Academy ratio, and shot entirely on soundstages."}, {"who": "Shourya", "text": "The castle barely seems real. It looks more like a set of huge concrete hallways. If Polanski takes us to a real place, Coen takes us inside someone’s head."}, {"who": "Andrew", "text": "Right. It feels a lot like German Expressionism or live theater. Cinematographer Bruno Delbonnel sends sharp beams of light through the windows and arches and leaves the rest in shadow."}, {"who": "Shourya", "text": "How does that change Act 1, Scene 5?"}, {"who": "Andrew", "text": "She’s in a bare stone room with sharp lines of light across her. Nothing feels warm. The room is as cold as her expression."}, {"who": "Shourya", "text": "And McDormand doesn’t make a big moment out of calling on the spirits. She’s quiet and almost emotionless, and in a way that’s scarier. Annis sounds like she’s trying to convince herself. McDormand sounds like she made up her mind years ago."}, {"who": "Andrew", "text": "Yes, and this is where age matters. Coen wanted an older couple who are down to their last chance. They have no kids and no future, so the crown is all they have left."}, {"who": "Shourya", "text": "McDormand has talked about this directly. She said the couple is past childbearing age, and that’s where the urgency comes from. It also explains a tiny detail I love. The film changes just one verb tense in Shakespeare’s wording. In the play, Macbeth talks about the sons she should have. In the film, it’s the sons she should have had."}, {"who": "Andrew", "text": "Wow. So one verb tells you the story of their whole marriage."}, {"who": "Shourya", "text": "Exactly. One small change, and now it’s too late. That answers the question Shakespeare left open. We asked where her ambition comes from, and Coen’s answer is that she’s running out of time."}, {"who": "Andrew", "text": "Right. And when a woman in her sixties asks the spirits to take away her womanhood, it means something different. She isn’t a young woman giving up her innocence. She’s someone who has lost a lot and still wants more."}, {"who": "Shourya", "text": "Here’s my issue, though. She’s so controlled in 1.5 that her breakdown later feels a little sudden."}, {"who": "Andrew", "text": "Seriously? The sleepwalking scene was my favorite part of the film."}, {"who": "Shourya", "text": "It’s a great scene on its own. My problem is how she develops. Annis shows cracks from the start, but McDormand seems unbreakable until she suddenly falls apart."}, {"who": "Andrew", "text": "I think the cracks are already there. She’s keeping everything inside, and the harsh lighting shows how empty her life is. Her breakdown is all of that finally coming out."}, {"who": "Shourya", "text": "Okay, that’s fair. That’s a better answer than I expected. I still think Annis makes us worry about her sooner, but you’ve made me like McDormand’s version more."}, {"who": "Andrew", "text": "The film’s speed adds to that. It’s only about an hour and forty-five minutes, so nothing lingers. Her downfall happens just as fast, so it feels sudden instead of slow."}, {"who": "Shourya", "text": "So Annis falls apart slowly in front of us, and McDormand holds on until she can’t. They end in the same place, but the road there is completely different."}, {"who": "Andrew", "text": "So let’s put them head to head."}]}, {"title": "Head to head: evil, ambition, pacing", "start": 780, "end": 960, "lines": [{"who": "Shourya", "text": "Let’s start with evil. Where does it come from in each movie?"}, {"who": "Andrew", "text": "In Polanski, it’s everywhere. The whole world is dirty, violent, and corrupt, and it swallows Lady Macbeth as soon as she steps in."}, {"who": "Shourya", "text": "In Coen, evil is more like emptiness. The sets are bare, the lighting is harsh, and she fills that emptiness with ambition. It feels almost existential."}, {"who": "Andrew", "text": "So in Polanski, evil comes from the outside, and in Coen, it comes from within."}, {"who": "Shourya", "text": "Yes, exactly. And I think that changes how much we blame her. In Polanski, I almost feel sorry for her. In Coen, she knows exactly what she’s doing."}, {"who": "Andrew", "text": "Now for ambition. Polanski’s Lady Macbeth wants a future with power and status. Coen’s wants the crown because she has no future left."}, {"who": "Shourya", "text": "And they’re both giving the same speech. One woman sounds hopeful and the other sounds desperate, so it’s the filmmaking that makes the difference, not the words."}, {"who": "Andrew", "text": "The pacing is different too. Polanski’s film runs over two hours and slows down in the middle, but 1.5 gets plenty of time."}, {"who": "Shourya", "text": "That slower pace helps her character, because we get to watch her change. Coen’s film moves faster and feels like a bad dream, but she has less time to develop."}, {"who": "Andrew", "text": "So each one gives something up. Coen wins on mood, and Polanski wins on character."}, {"who": "Shourya", "text": "Right. Quick note on costumes. Annis starts in light, flowing colors, and McDormand wears dark, plain, heavy clothes. It’s the same contrast again: innocence that gets stained versus a coldness that was always there."}, {"who": "Andrew", "text": "I didn’t notice that until you said it."}, {"who": "Shourya", "text": "Let’s finish this part with a fast round. I’ll name a category, and we each pick a Lady Macbeth. No explaining. Best setting?"}, {"who": "Andrew", "text": "Coen’s."}, {"who": "Shourya", "text": "Polanski’s. Scariest Lady Macbeth?"}, {"who": "Andrew", "text": "McDormand."}, {"who": "Shourya", "text": "McDormand, and I hate that I agree with you. Saddest Lady Macbeth?"}, {"who": "Andrew", "text": "Annis, honestly."}, {"who": "Shourya", "text": "Annis. So we agree on more than I expected, which makes the final verdict a lot more interesting."}]}, {"title": "Verdict and outro", "start": 960, "end": 1050, "lines": [{"who": "Andrew", "text": "Time for the verdict. Which Lady Macbeth do you believe more?"}, {"who": "Shourya", "text": "My vote goes to Polanski. Annis has further to fall. Because 1.5 shows us her innocence, the sleepwalking scene makes more sense and hits harder. Her story feels like a warning about someone who got exactly what she wanted and couldn’t live with it."}, {"who": "Andrew", "text": "I’m picking Coen. McDormand answers the question Shakespeare doesn’t, which is why she wants this so badly. She’s running out of time, and the lighting and empty sets make you feel that."}, {"who": "Shourya", "text": "So we’re split."}, {"who": "Andrew", "text": "And that’s really the point. The play leaves a question open, and each director answers it through casting, lighting, and setting."}, {"who": "Shourya", "text": "If you haven’t seen either one, watch Coen for the look and Polanski for Lady Macbeth’s story. Or watch both and compare their versions of 1.5 back to back."}, {"who": "Andrew", "text": "We did exactly that, and it shows how much a director can change the same lines."}, {"who": "Shourya", "text": "So here’s our question for you, the same one we started with. If you were casting Lady Macbeth today, would you go young or old? We’ve talked about it for this whole episode, and we still don’t agree. That’s all from us. I’m Shourya."}, {"who": "Andrew", "text": "And I’m Andrew. Thanks for listening to the Foul Fair Podcast."}]}];
const LEAD_IN = 3;
const TOTAL = SECTIONS[SECTIONS.length - 1].end;

// Build the script
const lines = [], heads = [];
SECTIONS.forEach((sec, i) => {
  const h = document.createElement('div');
  h.className = 'section-head';
  const title = document.createElement('h2');
  title.textContent = sec.title;
  const time = document.createElement('span');
  time.textContent = fmt(sec.start) + ' to ' + fmt(sec.end);
  h.append(title, time);
  body.append(h);
  heads.push(h);

  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = fmt(sec.start) + '  ' + sec.title;
  $('section').append(opt);

  sec.lines.forEach(l => {
    const row = document.createElement('div');
    row.className = 'line ' + l.who.toLowerCase();
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = l.who;
    const text = document.createElement('div');
    text.className = 'text';
    const m = l.text.match(/^(\(laughs\))(.*)$/);
    if (m) {
      const em = document.createElement('em');
      em.textContent = m[1];
      text.append(em, m[2]);
    } else {
      text.textContent = l.text;
    }
    row.append(who, text);
    body.append(row);
    lines.push({ el: row, who: l.who, top: 0 });
  });
});
$('total').textContent = fmt(TOTAL);

// Time drives position: each section fills its scripted minutes.
let anchors = [], readY = 0, expected = 0;
let t = -LEAD_IN, playing = false, last = 0, current = -1;

function topOf(el) {
  return el.getBoundingClientRect().top - stage.getBoundingClientRect().top + stage.scrollTop;
}
function measure() {
  const h = stage.clientHeight;
  readY = h * 0.3;
  script.style.paddingTop = Math.max(0, readY - head.offsetHeight) + 'px';
  script.style.paddingBottom = h + 'px';
  anchors = SECTIONS.map((s, i) => ({ t: s.start, y: topOf(heads[i]) - readY }));
  const lastLine = lines[lines.length - 1].el;
  anchors.push({ t: TOTAL, y: topOf(lastLine) + lastLine.offsetHeight - readY });
  lines.forEach(l => { l.top = topOf(l.el); });
}
function yAt(time) {
  const c = Math.max(0, Math.min(TOTAL, time));
  for (let i = 1; i < anchors.length; i++) {
    const a = anchors[i - 1], b = anchors[i];
    if (c <= b.t) return a.y + (b.y - a.y) * (c - a.t) / (b.t - a.t);
  }
  return anchors[anchors.length - 1].y;
}
function tAt(y) {
  if (y <= anchors[0].y) return 0;
  for (let i = 1; i < anchors.length; i++) {
    const a = anchors[i - 1], b = anchors[i];
    if (y <= b.y) return a.t + (b.t - a.t) * (y - a.y) / (b.y - a.y);
  }
  return TOTAL;
}
function paint() {
  stage.scrollTop = yAt(t);
  expected = stage.scrollTop;
  status();
}
function status() {
  $('clock').textContent = t < 0 ? 'Starts in ' + Math.ceil(-t) : fmt(t);
  const y = stage.scrollTop + readY + 4;
  let n = 0;
  for (let i = 0; i < lines.length; i++) { if (lines[i].top <= y) n = i; else break; }
  if (n !== current) {
    if (current >= 0) lines[current].el.classList.remove('now');
    lines[n].el.classList.add('now');
    current = n;
    const who = lines[n].who;
    $('speaker').textContent = who;
    $('speaker').className = who.toLowerCase();
    $('mark').className = who.toLowerCase();
  }
  let s = 0;
  SECTIONS.forEach((sec, i) => { if (t >= sec.start) s = i; });
  if ($('section').selectedIndex !== s) $('section').selectedIndex = s;
}

// Playback
let wake = null;
async function holdScreen() {
  try { if (playing && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }
  catch (e) { wake = null; }
}
function letScreenGo() {
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
function setPlaying(on) {
  playing = on;
  $('play').textContent = on ? 'Pause' : 'Play';
  last = 0;
  if (on) { holdScreen(); requestAnimationFrame(frame); } else { letScreenGo(); }
}
function frame(now) {
  if (!playing) return;
  if (last) {
    const dt = Math.min((now - last) / 1000, 0.1);
    t += t < 0 ? dt : dt * speed;
    if (t >= TOTAL) { t = TOTAL; paint(); setPlaying(false); return; }
    paint();
  }
  last = now;
  requestAnimationFrame(frame);
}
function jump(time) { t = time; paint(); }

// Manual scrolling moves the clock with it
let scrollShare = 0;
stage.addEventListener('scroll', () => {
  if (Math.abs(stage.scrollTop - expected) > 3) {
    t = tAt(stage.scrollTop);
    expected = stage.scrollTop;
    status();
    clearTimeout(scrollShare);
    scrollShare = setTimeout(share, 300);
  }
}, { passive: true });

// Controls
let speed = 1;
const clampSpeed = pct => Math.max(10, Math.min(300, pct));
function setSpeed(pct) {
  speed = pct / 100;
  $('speed').value = pct;
  if (document.activeElement !== $('speedOut')) $('speedOut').value = pct;
  store.set('speed', pct);
}
function setSize(px) {
  const size = Math.max(18, Math.min(48, px));
  document.documentElement.style.setProperty('--size', size + 'px');
  store.set('size', size);
  measure();
  paint();
}
function currentSize() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size'), 10);
}
function setFocus(who) {
  script.dataset.focus = who;
  $('focus').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.focus === who));
  store.set('focus', who);
}
function toggle() {
  if (t >= TOTAL) jump(-LEAD_IN);
  setPlaying(!playing);
}

$('play').addEventListener('click', () => { toggle(); share(); });
$('restart').addEventListener('click', () => { jump(-LEAD_IN); if (!playing) setPlaying(true); share(); });
$('speed').addEventListener('input', e => { setSpeed(Number(e.target.value)); share(); });
$('speedOut').addEventListener('change', e => {
  const typed = Math.round(Number(e.target.value));
  if (e.target.value !== '' && typed > 0) {
    setSpeed(clampSpeed(typed));
    share();
  }
  e.target.value = Math.round(speed * 100);
});
$('speedOut').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('smaller').addEventListener('click', () => setSize(currentSize() - 2));
$('larger').addEventListener('click', () => setSize(currentSize() + 2));
$('focus').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFocus(b.dataset.focus); });
$('section').addEventListener('change', e => { jump(SECTIONS[e.target.value].start); share(); });
body.addEventListener('click', e => {
  const row = e.target.closest('.line');
  if (!row || String(getSelection())) return;
  jump(tAt(topOf(row) - readY));
  share();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, button')) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); share(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); setSpeed(clampSpeed(Math.round(speed * 100) + 5)); share(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); setSpeed(clampSpeed(Math.round(speed * 100) - 5)); share(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { wake = null; holdScreen(); }
});
new ResizeObserver(() => { measure(); paint(); }).observe(stage);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); paint(); });

// Sync: playback state travels through public MQTT relays. Only numbers are sent, never the script.
const BROKERS = window.PROMPTER_BROKERS || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const deviceId = Math.random().toString(36).slice(2, 10);
const STALE_AFTER = 20;
let room = null, clients = [], seenRev = 0, seenId = '', leader = false, tick = 0;
const peers = new Map();
const topic = name => 'foul-fair-prompter/v1/' + room + '/' + name;

function publish(name, data, retain) {
  const msg = JSON.stringify(data);
  clients.forEach(c => { if (c.connected) c.publish(topic(name), msg, { qos: 0, retain }); });
}
function snapshot() {
  seenRev += 1;
  seenId = deviceId;
  return { id: deviceId, rev: seenRev, speed: Math.round(speed * 100), playing, t, at: Date.now() };
}
function share() {
  if (!room) return;
  leader = true;
  publish('state', snapshot(), true);
}
function receive(m, retained) {
  if (m.id === deviceId || !Number.isFinite(m.rev) || !Number.isFinite(m.t) || !Number.isFinite(m.speed)) return;
  if (m.rev < seenRev || (m.rev === seenRev && m.id <= seenId)) return;
  seenRev = m.rev;
  seenId = m.id;
  const heartbeat = m.hb === true;
  if (!heartbeat) leader = false;
  setSpeed(clampSpeed(Math.round(m.speed)));
  const age = Math.max(0, (Date.now() - m.at) / 1000);
  const abandoned = retained && age > STALE_AFTER;
  const on = m.playing === true && !abandoned;
  let target = Math.max(-LEAD_IN, Math.min(TOTAL, m.t));
  if (on) target += (retained ? age : 0.1) * (target < 0 ? 1 : speed);
  if (!heartbeat || Math.abs(target - t) > 1) jump(target);
  if (on !== playing) setPlaying(on);
}
function syncState(text, connected) {
  $('syncStatus').textContent = text;
  $('sync').classList.toggle('on', Boolean(connected));
  $('sync').textContent = connected ? 'Synced' : 'Sync';
}
function refreshStatus() {
  if (!room) return syncState('Not synced.', false);
  const up = clients.some(c => c.connected);
  const now = Date.now();
  peers.forEach((seen, id) => { if (now - seen > 11000) peers.delete(id); });
  if (!up) syncState('Connecting to the sync service…', false);
  else if (peers.size === 0) syncState('Room ' + room + ' is open. Waiting for the other device.', false);
  else syncState('Synced with ' + peers.size + (peers.size === 1 ? ' other device.' : ' other devices.'), true);
}
function leaveRoom() {
  clearInterval(tick);
  clients.forEach(c => c.end(true));
  clients = [];
  room = null;
  leader = false;
  seenRev = 0;
  seenId = '';
  peers.clear();
  $('leave').hidden = true;
  $('copyLink').hidden = true;
  store.set('room', '');
  refreshStatus();
}
function joinRoom(code) {
  const clean = code.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  if (clean.length < 3) return syncState('Use a code with at least 3 letters or numbers.', false);
  if (room) leaveRoom();
  if (!window.mqtt) return syncState('Sync could not load. Refresh the page and try again.', false);
  room = clean;
  $('roomCode').value = room;
  $('leave').hidden = false;
  $('copyLink').hidden = false;
  store.set('room', room);
  clients = BROKERS.map(url => {
    const c = mqtt.connect(url, { clientId: 'ffp-' + deviceId + Math.random().toString(36).slice(2, 6), reconnectPeriod: 3000, connectTimeout: 8000 });
    c.on('connect', () => {
      c.subscribe([topic('state'), topic('hello')], { qos: 0 });
      publish('hello', { id: deviceId }, false);
      refreshStatus();
    });
    c.on('close', refreshStatus);
    c.on('error', () => {});
    c.on('message', (name, payload, packet) => {
      let m;
      try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || typeof m !== 'object') return;
      if (name.endsWith('/hello')) {
        if (m.id && m.id !== deviceId) {
          if (!peers.has(String(m.id))) publish('hello', { id: deviceId }, false);
          peers.set(String(m.id), Date.now());
          refreshStatus();
        }
      } else {
        receive(m, packet.retain === true);
      }
    });
    return c;
  });
  // Nothing in the room yet: this device sets the starting state.
  const joined = room;
  setTimeout(() => { if (room === joined && seenRev === 0) share(); }, 2000);
  tick = setInterval(() => {
    publish('hello', { id: deviceId }, false);
    if (leader && playing && !document.hidden) publish('state', { ...snapshot(), hb: true }, true);
    refreshStatus();
  }, 4000);
  refreshStatus();
}

function openPanel(open) {
  $('syncPanel').hidden = !open;
  $('sync').setAttribute('aria-expanded', open);
  if (open && !room) {
    if (!$('roomCode').value) $('roomCode').value = store.get('room', '') || Math.random().toString(36).slice(2, 6).toUpperCase();
    $('roomCode').focus();
  }
}
$('sync').addEventListener('click', () => openPanel($('syncPanel').hidden));
$('closeSync').addEventListener('click', () => openPanel(false));
$('syncForm').addEventListener('submit', e => { e.preventDefault(); joinRoom($('roomCode').value); });
$('leave').addEventListener('click', leaveRoom);
$('copyLink').addEventListener('click', async () => {
  const link = location.origin + location.pathname + '?room=' + room;
  try { await navigator.clipboard.writeText(link); $('copyLink').textContent = 'Copied'; }
  catch (e) { $('roomCode').value = link; $('roomCode').select(); }
  setTimeout(() => { $('copyLink').textContent = 'Copy link'; }, 1500);
});

// Start
const linkedRoom = new URLSearchParams(location.search).get('room');
setSpeed(Number(store.get('speed', 100)) || 100);
setFocus(store.get('focus', 'both'));
setSize(Number(store.get('size', 0)) || (innerWidth < 640 ? 24 : 32));
if (linkedRoom) { setPlaying(false); openPanel(true); joinRoom(linkedRoom); }
else setPlaying(!matchMedia('(prefers-reduced-motion: reduce)').matches);
</script>
</body>
</html>
