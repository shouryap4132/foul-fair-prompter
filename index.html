<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}[hidden]{display:none!important}</style>
<script src="mqtt.min.js"></script>
<title>Foul Fair Prompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
/* Layout: a prompter stage with a fixed reading line, set like a printed playtext.
   Andrew argues for Coen, so his lines are silver. Shourya argues for Polanski, so his are in colour. */
:root {
  color-scheme: dark;
  --bg: #111317;
  --panel: #191c22;
  --line: #333844;
  --fg: #e9ebef;
  --muted: #a2a8b5;
  --andrew: #dfe6f2;
  --shourya: #f0a868;
  --ok: #7fd1a0;
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --size: 32px;
  --read: 30%;
}
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px;
}
.frame { position: relative; flex: 1; min-height: 0; }
#stage {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#script { max-width: 62rem; margin-inline: auto; font-family: var(--font-body); }
.head { display: grid; gap: 6px; padding-block: 24px; }
.head h1 { margin: 0; font: 400 clamp(28px, 5vw, 44px)/1.1 var(--font-display); text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font: 400 16px/1.4 var(--font-ui); }
.section-head {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
  padding-block: 40px 20px; font-family: var(--font-display); color: var(--muted);
}
.section-head h2 { margin: 0; font: italic 400 calc(var(--size) * 1.05)/1.2 var(--font-display); color: var(--fg); text-wrap: balance; }
.section-head span { font: 400 15px/1.2 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.line {
  display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 16px;
  padding-block: calc(var(--size) * .42); cursor: pointer; opacity: .82; transition: opacity .25s;
}
.who {
  padding-top: calc(var(--size) * .3); font: 600 14px/1 var(--font-ui);
  letter-spacing: .12em; text-transform: uppercase; text-align: right;
}
.text { font-size: var(--size); line-height: 1.42; min-width: 0; overflow-wrap: anywhere; }
.text em { color: var(--muted); }
.andrew { color: var(--andrew); }
.shourya { color: var(--shourya); }
.line.now { opacity: 1; }
[data-focus="andrew"] .line.shourya, [data-focus="shourya"] .line.andrew { opacity: .3; }
[data-focus="andrew"] .line.andrew, [data-focus="shourya"] .line.shourya { opacity: .84; }
[data-focus="andrew"] .line.andrew.now, [data-focus="shourya"] .line.shourya.now { opacity: 1; }
.end { padding-block: 40px; font: italic 400 24px/1.3 var(--font-display); color: var(--muted); }

.shade { position: absolute; inset-inline: 0; pointer-events: none; }
.shade.top { top: 0; height: 12%; background: linear-gradient(var(--bg), transparent); }
.shade.bottom { bottom: 0; height: 8%; background: linear-gradient(transparent, var(--bg)); }
#mark {
  position: absolute; inset-inline: 0; top: var(--read); height: 0; pointer-events: none;
  border-top: 1px solid var(--line); color: var(--muted);
}
#mark::before {
  content: ""; position: absolute; left: 0; top: -7px;
  border-block: 7px solid transparent; border-left: 11px solid currentColor;
}

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px; background: var(--panel); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.label { color: var(--muted); }
button, select {
  min-height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 400 15px var(--font-ui); cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--shourya); outline-offset: 2px; }
#play { min-width: 76px; font-weight: 600; background: var(--fg); color: var(--bg); border-color: var(--fg); }
#section { max-width: 11rem; }
.seg { display: flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button[aria-pressed="true"] { background: var(--line); border-color: var(--muted); position: relative; }
#speed { width: 110px; accent-color: var(--shourya); }
#speedOut { min-width: 3.2em; font-variant-numeric: tabular-nums; }
#sync.on { border-color: var(--ok); color: var(--ok); }
#syncPanel {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 2;
  width: min(22rem, calc(100% - 32px)); display: grid; gap: 10px; padding: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
#syncPanel h2 { margin: 0; font: 600 16px/1.2 var(--font-ui); }
#syncPanel p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
#syncPanel .row { display: flex; flex-wrap: wrap; gap: 8px; }
#roomCode {
  flex: 1; min-width: 7rem; min-height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 600 18px var(--font-ui); letter-spacing: .12em; text-transform: uppercase;
}
#syncStatus { color: var(--fg); }
.clock { margin-left: auto; display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#clock { font-size: 20px; font-weight: 600; }
#speaker { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }

@media (max-width: 640px) {
  .line { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .who { text-align: left; padding-top: 0; }
  .bar { gap: 8px 12px; padding-block: 8px; }
  #section { max-width: 11rem; }
  .only-wide { display: none; }
  #speed { width: 84px; }
}
@media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>
</head>
<body>
<div class="frame">
  <div id="stage">
    <div id="script" data-focus="both">
      <header class="head" id="head">
        <h1>The Foul Fair Podcast</h1>
        <p>Lady Macbeth in Polanski (1971) and Coen (2021). Click any line to jump there.</p>
      </header>
      <div id="body"></div>
      <p class="end">End of episode.</p>
    </div>
  </div>
  <div class="shade top"></div>
  <div class="shade bottom"></div>
  <div id="mark"></div>
  <div id="syncPanel" hidden>
    <h2>Sync two devices</h2>
    <p>Enter the same code on both devices. Speed, play, pause and position will match.</p>
    <form class="row" id="syncForm">
      <input id="roomCode" aria-label="Room code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="join" type="submit">Join</button>
    </form>
    <p id="syncStatus" role="status">Not synced.</p>
    <div class="row">
      <button id="copyLink" type="button" hidden>Copy link</button>
      <button id="leave" type="button" hidden>Leave</button>
      <button id="closeSync" type="button">Close</button>
    </div>
  </div>
</div>

<div class="bar">
  <div class="group">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <button id="sync" type="button" aria-expanded="false">Sync</button>
  </div>
  <div class="group">
    <label class="label" for="speed">Speed</label>
    <input id="speed" type="range" min="50" max="150" step="5" value="100">
    <output id="speedOut" for="speed">100%</output>
  </div>
  <div class="group">
    <span class="label only-wide">Text</span>
    <button id="smaller" type="button" aria-label="Make text smaller">A−</button>
    <button id="larger" type="button" aria-label="Make text larger">A+</button>
  </div>
  <div class="group">
    <span class="label only-wide">Highlight</span>
    <div class="seg" id="focus" role="group" aria-label="Highlight a speaker">
      <button type="button" data-focus="both" aria-pressed="true">Both</button>
      <button type="button" data-focus="andrew" aria-pressed="false">Andrew</button>
      <button type="button" data-focus="shourya" aria-pressed="false">Shourya</button>
    </div>
  </div>
  <div class="group">
    <select id="section" aria-label="Jump to section"></select>
  </div>
  <div class="clock">
    <span id="speaker"></span>
    <span id="clock" aria-live="off">0:00</span>
    <span class="label">/ <span id="total"></span></span>
  </div>
</div>

<script>
const SECTIONS = [{"title": "Cold open and intro", "start": 0, "end": 120, "lines": [{"who": "Shourya", "text": "Okay, quick question before we even start. If you had to cast Lady Macbeth, do you go young or old?"}, {"who": "Andrew", "text": "Old. Easily. Someone who’s been waiting her whole life for this."}, {"who": "Shourya", "text": "See, I’d have said young, and that’s basically the whole episode right there."}, {"who": "Andrew", "text": "(laughs) Should we actually introduce ourselves?"}, {"who": "Shourya", "text": "Probably. Welcome to the show, I’m Shourya."}, {"who": "Andrew", "text": "And I’m Andrew. You’re joining in on the Foul Fair Podcast. Today we’re comparing two film versions of Macbeth: Roman Polanski’s from 1971 and Joel Coen’s The Tragedy of Macbeth from 2021."}, {"who": "Shourya", "text": "And we’re zooming in on one character, Lady Macbeth, and pretty much one scene: Act 1, Scene 5. That’s where she reads Macbeth’s letters about the witches and calls on the spirits to “unsex” her."}, {"who": "Andrew", "text": "Right. And the question we keep coming back to is, do you actually believe her? Does her motivation make sense in each movie?"}, {"who": "Shourya", "text": "Because these two directors make completely different bets. Polanski casts Francesca Annis, who’s in her twenties. She’s young, she’s gorgeous, she looks almost innocent, and she’s manipulating everything behind the scenes"}, {"who": "Andrew", "text": "And Coen casts Frances McDormand, who’s in her sixties. She’s older, colder, and honestly kind of exhausted. Same name, totally different woman."}, {"who": "Shourya", "text": "So we’ll go text first, then each film, then debate about which one fits Shakespeare’s intention better."}, {"who": "Andrew", "text": "Mostly debate."}]}, {"title": "What Shakespeare gives us", "start": 120, "end": 300, "lines": [{"who": "Andrew", "text": "So before the movies, what does the play actually tell us about her in Act 1, Scene 5?"}, {"who": "Shourya", "text": "Honestly, almost nothing about why. She reads the letter, and the first thing she does isn’t celebrate. She worries about Macbeth. She says he’s too kind and too gentle to take the shortcut to the crown."}, {"who": "Andrew", "text": "Which is kind of a backhanded compliment to Macbeth."}, {"who": "Shourya", "text": "Totally. She’s already decided the murder is happening. The only question is whether he can handle it."}, {"who": "Andrew", "text": "And then the messenger says Duncan’s coming that night, and she goes straight to saying that even the raven sounds hoarse announcing Duncan’s fatal arrival under her battlements. Her battlements. Not theirs."}, {"who": "Shourya", "text": "Oh, good catch. And then the big one. She calls on the spirits to strip away her womanhood and fill her, head to toe, with the worst kind of cruelty."}, {"who": "Andrew", "text": "So here’s what I think is interesting. She’s asking to become evil. That means she isn't evil yet, right? You don’t pray for something you already have."}, {"who": "Shourya", "text": "Yeah, that’s key for us. Shakespeare leaves that gap. He shows ambition but never explains where it comes from, so a director has to fill that gap with their interpretation, and how they fill it decides whether we believe her."}, {"who": "Andrew", "text": "And they also have to set up the payoff in Act 5. The woman who begs for thick darkness to hide the knife is the same woman sleepwalking and scrubbing at a spot of blood that isn’t there."}, {"who": "Shourya", "text": "Right, so if 1.5 doesn’t plant some crack in her, the breakdown later would feel random."}, {"who": "Andrew", "text": "One more line worth flagging, from Act 2, Scene 2. She says she would’ve done it herself, except Duncan looked too much like her father while he slept. She literally can’t kill him."}, {"who": "Shourya", "text": "So she’s not as cold as she wants to be. Hold onto that, because the two movies use it really differently."}]}, {"title": "Polanski’s Lady Macbeth, 1971", "start": 300, "end": 540, "lines": [{"who": "Shourya", "text": "Okay, Polanski. First thing you notice is it’s in color, shot on location in real castles and real landscapes. There’s mud, animals, and actual daylight."}, {"who": "Andrew", "text": "It feels like a real medieval place, not a stage."}, {"who": "Shourya", "text": "And that matters for 1.5. When Annis reads the letter, she’s alone in a stone chamber, and the light is soft and natural. She’s surrounded by animals, so she looks like a young wife getting good news."}, {"who": "Andrew", "text": "That’s what got me. The mise-en-scene is almost cozy, and then the words coming out of her are about murder. It’s like when she tells Macbeth to look like an innocent flower and be the snake hiding underneath, except she’s doing it with the whole scene."}, {"who": "Shourya", "text": "Wait, that’s actually a good way to put it. Polanski makes the setting the innocent flower."}, {"who": "Andrew", "text": "And Polanski uses wide shots, allowing us to see her interaction with the comfortable surroundings, contrasting the dark, ambitious intentions."}, {"who": "Shourya", "text": "So is she believable? I think yes, but in a specific way. Her motivation reads as ambition with no experience. She’s young enough that she doesn't really know what murder costs yet."}, {"who": "Andrew", "text": "Right, the spirit's speech sounds less like a witch and more like she’s convincing herself or psyching herself up."}, {"who": "Shourya", "text": "And that sets up the payoff. Polanski also does something the play doesn’t. He shows Duncan's murder on screen, and it’s really violent."}, {"who": "Andrew", "text": "Which, for context, Polanski made this right after his wife Sharon Tate was murdered in 1969. A lot of critics read the violence through that."}, {"who": "Shourya", "text": "Yeah. So when Annis’s Lady Macbeth sees what they’ve actually done, the innocence cracks. Her sleepwalking scene plays like a kid who’s realized she broke something she can’t fix."}, {"who": "Andrew", "text": "Okay, but my pushback: sometimes her innocence makes her harder to believe as Lady Macbeth. In the play, she threatens Macbeth with the image of killing her own baby to prove her determination. It’s hard to imagine someone who seems so gentle and innocent saying something that disturbing."}, {"who": "Shourya", "text": "I think that’s intentional. Polanski portrays her as someone whose ambition is greater than her experience or understanding of violence. But I agree that sometimes her sweet appearance makes it difficult to see her as the powerful, manipulative figure Shakespeare originally wrote."}]}, {"title": "Coen’s Lady Macbeth, 2021", "start": 540, "end": 780, "lines": [{"who": "Andrew", "text": "Okay, my turn. Coen’s version is the total opposite visually. Black and white, uses an almost square frame with the old 1.37:1 Academy ratio, and was filmed entirely on soundstages."}, {"who": "Shourya", "text": "The castle doesn't even look real. It looks more like a series of giant concrete hallways,"}, {"who": "Andrew", "text": "Exactly. It feels more like German Expressionism or a stage play. Cinematographer Bruno Delbonnel uses sharp beams of light through windows and archways, while the rest of the room stays in shadow."}, {"who": "Shourya", "text": "So what does that do in Act 1 Scene 5?"}, {"who": "Andrew", "text": "She’s in an empty stone room, and the light falls across her in sharp lines. There’s no warmth. The setting feels as cold as her expression."}, {"who": "Shourya", "text": "And McDormand doesn't have a big moment of calling on the spirits. She's quiet and almost emotionless."}, {"who": "Andrew", "text": "Yeah. That’s where her age matters. Coen intended these two characters to be older, as if this is their last chance. They have no children and no future, so the crown is all they have left,"}, {"who": "Shourya", "text": "that actually fills Shakespeare’s gap really well. We wondered where the ambition comes from, and Coen answers that time is running out."}, {"who": "Andrew", "text": "Right. So when she asks the spirits to take away her womanhood, it means something different coming from a woman in her sixties. She’s not a young woman rejecting her innocence. She’s someone who has already lost so much and wants something more."}, {"who": "Shourya", "text": "Okay, but here’s my problem. She’s so controlled in 1.5 that her breakdown later almost feels unexpected."}, {"who": "Andrew", "text": "Really? I thought the sleepwalking scene was the best scene in the movie."}, {"who": "Shourya", "text": "The scene itself is great. I mean her character development. Annis shows cracks from the beginning. McDormand seems completely unbreakable, then suddenly falls apart."}, {"who": "Andrew", "text": "I’d argue that the wall is already cracking. She’s holding everything inside, and the stark lighting reflects how empty her life has become. Her breakdown is everything she’s been holding back finally coming out."}, {"who": "Shourya", "text": "Fair. That’s a much better explanation than I expected."}, {"who": "Andrew", "text": "The pacing helps too. The film is only about an hour and forty-five minutes, so everything moves quickly. Her downfall happens just as fast, making it feel like a sudden collapse rather than a slow decline."}]}, {"title": "Head to head: evil, ambition, pacing", "start": 780, "end": 960, "lines": [{"who": "Shourya", "text": "Let’s compare them, starting with evil. Where does it come from in each film?"}, {"who": "Andrew", "text": "In Polanski, evil is everywhere. The world is muddy, bloody, and corrupt, and Lady Macbeth walks in and gets swallowed."}, {"who": "Shourya", "text": "In Coen, evil is an emptiness. The sets are bare, the light is harsh, and Lady Macbeth fills that emptiness with ambition. It's almost existential."}, {"who": "Andrew", "text": "Oh, so Polanski’s evil is outside her, and Coen’s is inside her."}, {"who": "Shourya", "text": "I agree."}, {"who": "Andrew", "text": "Next, ambition. Polanski’s Lady Macbeth wants a future: power, status, a long reign. Coen's wants it because she has no future."}, {"who": "Shourya", "text": "And it’s the same speech, which proves the film techniques are doing the work, not the words."}, {"who": "Andrew", "text": "Pacing is different. Polanski’s film runs over two hours and the middle drags, but 1.5 gets room to breathe."}, {"who": "Shourya", "text": "That slower pace helps her character, because we watch her change. Coen is tighter, so it feels like a nightmare, but Lady Macbeth has less time to develop."}, {"who": "Andrew", "text": "So it’s a trade-off: Coen gets tone, Polanski gets character."}, {"who": "Shourya", "text": "Exactly. One costume note: Annis wears light, flowing colors early on, while McDormand wears dark, plain, heavy fabric. It’s the same idea again: innocence that gets stained versus coldness that was always there."}]}, {"title": "Verdict and outro", "start": 960, "end": 1050, "lines": [{"who": "Andrew", "text": "Final Verdict. Which Lady Macbeth is more believable?"}, {"who": "Shourya", "text": "I’m going, Polanski. Annis gives her somewhere to fall from. We see her innocence in 1.5, so the sleepwalking scene makes more sense and has a stronger impact."}, {"who": "Andrew", "text": "I’m going, Coen. McDormand answers what Shakespeare doesn’t: why does she want this so badly? Because she’s running out of time, and the lighting and empty sets make you feel it."}, {"who": "Shourya", "text": "So we disagree."}, {"who": "Andrew", "text": "Which is kind of the point. The play leaves a gap, and each director fills it with lighting, casting, and setting."}, {"who": "Shourya", "text": "If you’re new to these, watch Coen for the visuals and Polanski for Lady Macbeth’s story. Or watch both and compare 1.5 back-to-back."}, {"who": "Andrew", "text": "That’s what we did, and it shows how much a director can change the same words."}, {"who": "Shourya", "text": "That’s it for us. I’m Shourya."}, {"who": "Andrew", "text": "And I’m Andrew. Thanks for tuning in on the Foul Fair Podcast."}]}];
const LEAD_IN = 3;
const TOTAL = SECTIONS[SECTIONS.length - 1].end;

const $ = id => document.getElementById(id);
const stage = $('stage'), script = $('script'), body = $('body'), head = $('head');
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

const store = {
  get(k, d) { try { const v = localStorage.getItem('prompter-' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('prompter-' + k, v); } catch (e) {} }
};

// Build the script
const lines = [], heads = [];
SECTIONS.forEach((sec, i) => {
  const h = document.createElement('div');
  h.className = 'section-head';
  const title = document.createElement('h2');
  title.textContent = sec.title;
  const time = document.createElement('span');
  time.textContent = fmt(sec.start) + ' to ' + fmt(sec.end);
  h.append(title, time);
  body.append(h);
  heads.push(h);

  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = fmt(sec.start) + '  ' + sec.title;
  $('section').append(opt);

  sec.lines.forEach(l => {
    const row = document.createElement('div');
    row.className = 'line ' + l.who.toLowerCase();
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = l.who;
    const text = document.createElement('div');
    text.className = 'text';
    const m = l.text.match(/^(\(laughs\))(.*)$/);
    if (m) {
      const em = document.createElement('em');
      em.textContent = m[1];
      text.append(em, m[2]);
    } else {
      text.textContent = l.text;
    }
    row.append(who, text);
    body.append(row);
    lines.push({ el: row, who: l.who, top: 0 });
  });
});
$('total').textContent = fmt(TOTAL);

// Time drives position: each section fills its scripted minutes.
let anchors = [], readY = 0, expected = 0;
let t = -LEAD_IN, playing = false, last = 0, current = -1;

function topOf(el) {
  return el.getBoundingClientRect().top - stage.getBoundingClientRect().top + stage.scrollTop;
}
function measure() {
  const h = stage.clientHeight;
  readY = h * 0.3;
  script.style.paddingTop = Math.max(0, readY - head.offsetHeight) + 'px';
  script.style.paddingBottom = h + 'px';
  anchors = SECTIONS.map((s, i) => ({ t: s.start, y: topOf(heads[i]) - readY }));
  const lastLine = lines[lines.length - 1].el;
  anchors.push({ t: TOTAL, y: topOf(lastLine) + lastLine.offsetHeight - readY });
  lines.forEach(l => { l.top = topOf(l.el); });
}
function yAt(time) {
  const c = Math.max(0, Math.min(TOTAL, time));
  for (let i = 1; i < anchors.length; i++) {
    const a = anchors[i - 1], b = anchors[i];
    if (c <= b.t) return a.y + (b.y - a.y) * (c - a.t) / (b.t - a.t);
  }
  return anchors[anchors.length - 1].y;
}
function tAt(y) {
  if (y <= anchors[0].y) return 0;
  for (let i = 1; i < anchors.length; i++) {
    const a = anchors[i - 1], b = anchors[i];
    if (y <= b.y) return a.t + (b.t - a.t) * (y - a.y) / (b.y - a.y);
  }
  return TOTAL;
}
function paint() {
  stage.scrollTop = yAt(t);
  expected = stage.scrollTop;
  status();
}
function status() {
  $('clock').textContent = t < 0 ? 'Starts in ' + Math.ceil(-t) : fmt(t);
  const y = stage.scrollTop + readY + 4;
  let n = 0;
  for (let i = 0; i < lines.length; i++) { if (lines[i].top <= y) n = i; else break; }
  if (n !== current) {
    if (current >= 0) lines[current].el.classList.remove('now');
    lines[n].el.classList.add('now');
    current = n;
    const who = lines[n].who;
    $('speaker').textContent = who;
    $('speaker').className = who.toLowerCase();
    $('mark').className = who.toLowerCase();
  }
  let s = 0;
  SECTIONS.forEach((sec, i) => { if (t >= sec.start) s = i; });
  if ($('section').selectedIndex !== s) $('section').selectedIndex = s;
}

// Playback
let wake = null;
async function holdScreen() {
  try { if (playing && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }
  catch (e) { wake = null; }
}
function letScreenGo() {
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
function setPlaying(on) {
  playing = on;
  $('play').textContent = on ? 'Pause' : 'Play';
  last = 0;
  if (on) { holdScreen(); requestAnimationFrame(frame); } else { letScreenGo(); }
}
function frame(now) {
  if (!playing) return;
  if (last) {
    const dt = Math.min((now - last) / 1000, 0.1);
    t += t < 0 ? dt : dt * speed;
    if (t >= TOTAL) { t = TOTAL; paint(); setPlaying(false); return; }
    paint();
  }
  last = now;
  requestAnimationFrame(frame);
}
function jump(time) { t = time; paint(); }

// Manual scrolling moves the clock with it
let scrollShare = 0;
stage.addEventListener('scroll', () => {
  if (Math.abs(stage.scrollTop - expected) > 3) {
    t = tAt(stage.scrollTop);
    expected = stage.scrollTop;
    status();
    clearTimeout(scrollShare);
    scrollShare = setTimeout(share, 300);
  }
}, { passive: true });

// Controls
let speed = 1;
function setSpeed(pct) {
  speed = pct / 100;
  $('speed').value = pct;
  $('speedOut').textContent = pct + '%';
  store.set('speed', pct);
}
function setSize(px) {
  const size = Math.max(18, Math.min(48, px));
  document.documentElement.style.setProperty('--size', size + 'px');
  store.set('size', size);
  measure();
  paint();
}
function currentSize() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size'), 10);
}
function setFocus(who) {
  script.dataset.focus = who;
  $('focus').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.focus === who));
  store.set('focus', who);
}
function toggle() {
  if (t >= TOTAL) jump(-LEAD_IN);
  setPlaying(!playing);
}

$('play').addEventListener('click', () => { toggle(); share(); });
$('restart').addEventListener('click', () => { jump(-LEAD_IN); if (!playing) setPlaying(true); share(); });
$('speed').addEventListener('input', e => { setSpeed(Number(e.target.value)); share(); });
$('smaller').addEventListener('click', () => setSize(currentSize() - 2));
$('larger').addEventListener('click', () => setSize(currentSize() + 2));
$('focus').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFocus(b.dataset.focus); });
$('section').addEventListener('change', e => { jump(SECTIONS[e.target.value].start); share(); });
body.addEventListener('click', e => {
  const row = e.target.closest('.line');
  if (!row || String(getSelection())) return;
  jump(tAt(topOf(row) - readY));
  share();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, button')) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); share(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); setSpeed(Math.min(150, Math.round(speed * 100) + 5)); share(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); setSpeed(Math.max(50, Math.round(speed * 100) - 5)); share(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { wake = null; holdScreen(); }
});
new ResizeObserver(() => { measure(); paint(); }).observe(stage);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); paint(); });

// Sync: playback state travels through public MQTT relays. Only numbers are sent, never the script.
const BROKERS = window.PROMPTER_BROKERS || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const deviceId = Math.random().toString(36).slice(2, 10);
const STALE_AFTER = 20;
let room = null, clients = [], seenRev = 0, seenId = '', leader = false, tick = 0;
const peers = new Map();
const topic = name => 'foul-fair-prompter/v1/' + room + '/' + name;

function publish(name, data, retain) {
  const msg = JSON.stringify(data);
  clients.forEach(c => { if (c.connected) c.publish(topic(name), msg, { qos: 0, retain }); });
}
function snapshot() {
  seenRev += 1;
  seenId = deviceId;
  return { id: deviceId, rev: seenRev, speed: Math.round(speed * 100), playing, t, at: Date.now() };
}
function share() {
  if (!room) return;
  leader = true;
  publish('state', snapshot(), true);
}
function receive(m, retained) {
  if (m.id === deviceId || !Number.isFinite(m.rev) || !Number.isFinite(m.t) || !Number.isFinite(m.speed)) return;
  if (m.rev < seenRev || (m.rev === seenRev && m.id <= seenId)) return;
  seenRev = m.rev;
  seenId = m.id;
  const heartbeat = m.hb === true;
  if (!heartbeat) leader = false;
  setSpeed(Math.max(50, Math.min(150, Math.round(m.speed))));
  const age = Math.max(0, (Date.now() - m.at) / 1000);
  const abandoned = retained && age > STALE_AFTER;
  const on = m.playing === true && !abandoned;
  let target = Math.max(-LEAD_IN, Math.min(TOTAL, m.t));
  if (on) target += (retained ? age : 0.1) * (target < 0 ? 1 : speed);
  if (!heartbeat || Math.abs(target - t) > 1) jump(target);
  if (on !== playing) setPlaying(on);
}
function syncState(text, connected) {
  $('syncStatus').textContent = text;
  $('sync').classList.toggle('on', Boolean(connected));
  $('sync').textContent = connected ? 'Synced' : 'Sync';
}
function refreshStatus() {
  if (!room) return syncState('Not synced.', false);
  const up = clients.some(c => c.connected);
  const now = Date.now();
  peers.forEach((seen, id) => { if (now - seen > 11000) peers.delete(id); });
  if (!up) syncState('Connecting to the sync service…', false);
  else if (peers.size === 0) syncState('Room ' + room + ' is open. Waiting for the other device.', false);
  else syncState('Synced with ' + peers.size + (peers.size === 1 ? ' other device.' : ' other devices.'), true);
}
function leaveRoom() {
  clearInterval(tick);
  clients.forEach(c => c.end(true));
  clients = [];
  room = null;
  leader = false;
  seenRev = 0;
  seenId = '';
  peers.clear();
  $('leave').hidden = true;
  $('copyLink').hidden = true;
  store.set('room', '');
  refreshStatus();
}
function joinRoom(code) {
  const clean = code.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  if (clean.length < 3) return syncState('Use a code with at least 3 letters or numbers.', false);
  if (room) leaveRoom();
  if (!window.mqtt) return syncState('Sync could not load. Refresh the page and try again.', false);
  room = clean;
  $('roomCode').value = room;
  $('leave').hidden = false;
  $('copyLink').hidden = false;
  store.set('room', room);
  clients = BROKERS.map(url => {
    const c = mqtt.connect(url, { clientId: 'ffp-' + deviceId + Math.random().toString(36).slice(2, 6), reconnectPeriod: 3000, connectTimeout: 8000 });
    c.on('connect', () => {
      c.subscribe([topic('state'), topic('hello')], { qos: 0 });
      publish('hello', { id: deviceId }, false);
      refreshStatus();
    });
    c.on('close', refreshStatus);
    c.on('error', () => {});
    c.on('message', (name, payload, packet) => {
      let m;
      try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || typeof m !== 'object') return;
      if (name.endsWith('/hello')) {
        if (m.id && m.id !== deviceId) {
          if (!peers.has(String(m.id))) publish('hello', { id: deviceId }, false);
          peers.set(String(m.id), Date.now());
          refreshStatus();
        }
      } else {
        receive(m, packet.retain === true);
      }
    });
    return c;
  });
  // Nothing in the room yet: this device sets the starting state.
  const joined = room;
  setTimeout(() => { if (room === joined && seenRev === 0) share(); }, 2000);
  tick = setInterval(() => {
    publish('hello', { id: deviceId }, false);
    if (leader && playing && !document.hidden) publish('state', { ...snapshot(), hb: true }, true);
    refreshStatus();
  }, 4000);
  refreshStatus();
}

function openPanel(open) {
  $('syncPanel').hidden = !open;
  $('sync').setAttribute('aria-expanded', open);
  if (open && !room) {
    if (!$('roomCode').value) $('roomCode').value = store.get('room', '') || Math.random().toString(36).slice(2, 6).toUpperCase();
    $('roomCode').focus();
  }
}
$('sync').addEventListener('click', () => openPanel($('syncPanel').hidden));
$('closeSync').addEventListener('click', () => openPanel(false));
$('syncForm').addEventListener('submit', e => { e.preventDefault(); joinRoom($('roomCode').value); });
$('leave').addEventListener('click', leaveRoom);
$('copyLink').addEventListener('click', async () => {
  const link = location.origin + location.pathname + '?room=' + room;
  try { await navigator.clipboard.writeText(link); $('copyLink').textContent = 'Copied'; }
  catch (e) { $('roomCode').value = link; $('roomCode').select(); }
  setTimeout(() => { $('copyLink').textContent = 'Copy link'; }, 1500);
});

// Start
const linkedRoom = new URLSearchParams(location.search).get('room');
setSpeed(Number(store.get('speed', 100)) || 100);
setFocus(store.get('focus', 'both'));
setSize(Number(store.get('size', 0)) || (innerWidth < 640 ? 24 : 32));
if (linkedRoom) { setPlaying(false); openPanel(true); joinRoom(linkedRoom); }
else setPlaying(!matchMedia('(prefers-reduced-motion: reduce)').matches);
</script>
</body>
</html>
