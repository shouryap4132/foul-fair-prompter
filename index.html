<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}body{margin:0}[hidden]{display:none!important}</style>
<script src="mqtt.min.js"></script>
<title>Foul Fair Prompter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IBM+Plex+Sans+Condensed:wght@400;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
/* Layout: a prompter stage with a fixed reading line, set like a printed playtext.
   Andrew argues for Coen, so his lines are silver. Shourya argues for Polanski, so his are in colour. */
:root {
  color-scheme: dark;
  --bg: #111317;
  --panel: #191c22;
  --line: #333844;
  --fg: #e9ebef;
  --muted: #a2a8b5;
  --andrew: #dfe6f2;
  --shourya: #f0a868;
  --ok: #7fd1a0;
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --size: 32px;
  --read: 30%;
}
html, body { height: 100%; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px;
}
.frame { position: relative; flex: 1; min-height: 0; }
#stage {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#script { max-width: 62rem; margin-inline: auto; font-family: var(--font-body); }
.head { display: grid; gap: 6px; padding-block: 24px; }
.head h1 { margin: 0; font: 400 clamp(28px, 5vw, 44px)/1.1 var(--font-display); text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font: 400 16px/1.4 var(--font-ui); }
.section-head {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
  padding-block: 40px 20px; font-family: var(--font-display); color: var(--muted);
}
.section-head h2 { margin: 0; font: italic 400 calc(var(--size) * 1.05)/1.2 var(--font-display); color: var(--fg); text-wrap: balance; }
.section-head span { font: 400 15px/1.2 var(--font-ui); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.line {
  display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 16px;
  padding-block: calc(var(--size) * .42); cursor: pointer; opacity: .82; transition: opacity .25s;
}
.who {
  padding-top: calc(var(--size) * .3); font: 600 14px/1 var(--font-ui);
  letter-spacing: .12em; text-transform: uppercase; text-align: right;
}
.text { font-size: var(--size); line-height: 1.42; min-width: 0; overflow-wrap: anywhere; }
.text em { color: var(--muted); }
.andrew { color: var(--andrew); }
.shourya { color: var(--shourya); }
.line.now { opacity: 1; }
[data-focus="andrew"] .line.shourya, [data-focus="shourya"] .line.andrew { opacity: .3; }
[data-focus="andrew"] .line.andrew, [data-focus="shourya"] .line.shourya { opacity: .84; }
[data-focus="andrew"] .line.andrew.now, [data-focus="shourya"] .line.shourya.now { opacity: 1; }
.end { padding-block: 40px; font: italic 400 24px/1.3 var(--font-display); color: var(--muted); }

.shade { position: absolute; inset-inline: 0; pointer-events: none; }
.shade.top { top: 0; height: 12%; background: linear-gradient(var(--bg), transparent); }
.shade.bottom { bottom: 0; height: 8%; background: linear-gradient(transparent, var(--bg)); }
#mark {
  position: absolute; inset-inline: 0; top: var(--read); height: 0; pointer-events: none;
  border-top: 1px solid var(--line); color: var(--muted);
}
#mark::before {
  content: ""; position: absolute; left: 0; top: -7px;
  border-block: 7px solid transparent; border-left: 11px solid currentColor;
}

.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px; background: var(--panel); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.label { color: var(--muted); }
button, select {
  min-height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 400 15px var(--font-ui); cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--shourya); outline-offset: 2px; }
#play { min-width: 76px; font-weight: 600; background: var(--fg); color: var(--bg); border-color: var(--fg); }
#section { max-width: 11rem; }
.seg { display: flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
.seg button:last-child { border-radius: 0 4px 4px 0; }
.seg button[aria-pressed="true"] { background: var(--line); border-color: var(--muted); position: relative; }
#speed { width: 110px; accent-color: var(--shourya); }
#speedOut {
  width: 4.2em; min-height: 40px; padding-inline: 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 400 15px var(--font-ui); font-variant-numeric: tabular-nums;
}
#sync.on { border-color: var(--ok); color: var(--ok); }
#syncPanel {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px; z-index: 2;
  width: min(22rem, calc(100% - 32px)); display: grid; gap: 10px; padding: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
#syncPanel h2 { margin: 0; font: 600 16px/1.2 var(--font-ui); }
#syncPanel p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
#syncPanel .row { display: flex; flex-wrap: wrap; gap: 8px; }
#roomCode {
  flex: 1; min-width: 7rem; min-height: 40px; padding-inline: 12px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: 600 18px var(--font-ui); letter-spacing: .12em; text-transform: uppercase;
}
#syncStatus { color: var(--fg); }
.clock { margin-left: auto; display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#clock { font-size: 20px; font-weight: 600; }
#speaker { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }

@media (max-width: 640px) {
  .line { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .who { text-align: left; padding-top: 0; }
  .bar { gap: 8px 12px; padding-block: 8px; }
  #section { max-width: 11rem; }
  .only-wide { display: none; }
  #speed { width: 84px; }
}
@media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>
</head>
<body>
<div class="frame">
  <div id="stage">
    <div id="script" data-focus="both">
      <header class="head" id="head">
        <h1>The Foul Fair Podcast</h1>
        <p>Lady Macbeth in Polanski (1971) and Coen (2021). Click any line to jump there.</p>
      </header>
      <div id="body"></div>
      <p class="end">End of episode.</p>
    </div>
  </div>
  <div class="shade top"></div>
  <div class="shade bottom"></div>
  <div id="mark"></div>
  <div id="syncPanel" hidden>
    <h2>Sync two devices</h2>
    <p>Enter the same code on both devices. Speed, play, pause and position will match.</p>
    <form class="row" id="syncForm">
      <input id="roomCode" aria-label="Room code" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="join" type="submit">Join</button>
    </form>
    <p id="syncStatus" role="status">Not synced.</p>
    <div class="row">
      <button id="copyLink" type="button" hidden>Copy link</button>
      <button id="leave" type="button" hidden>Leave</button>
      <button id="closeSync" type="button">Close</button>
    </div>
  </div>
</div>

<div class="bar">
  <div class="group">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <button id="sync" type="button" aria-expanded="false">Sync</button>
  </div>
  <div class="group">
    <label class="label" for="speed">Speed</label>
    <input id="speed" type="range" min="50" max="150" step="1" value="100">
    <input id="speedOut" type="number" inputmode="numeric" min="10" max="300" step="1" value="100" aria-label="Speed in percent"><span class="label">%</span>
  </div>
  <div class="group">
    <span class="label only-wide">Text</span>
    <button id="smaller" type="button" aria-label="Make text smaller">A−</button>
    <button id="larger" type="button" aria-label="Make text larger">A+</button>
  </div>
  <div class="group">
    <span class="label only-wide">Highlight</span>
    <div class="seg" id="focus" role="group" aria-label="Highlight a speaker">
      <button type="button" data-focus="both" aria-pressed="true">Both</button>
      <button type="button" data-focus="andrew" aria-pressed="false">Andrew</button>
      <button type="button" data-focus="shourya" aria-pressed="false">Shourya</button>
    </div>
  </div>
  <div class="group">
    <select id="section" aria-label="Jump to section"></select>
  </div>
  <div class="clock">
    <span id="speaker"></span>
    <span id="clock" aria-live="off">0:00</span>
    <span class="label">/ <span id="total"></span></span>
  </div>
</div>

<script>
const SECTIONS = [{"title": "Cold open and intro", "start": 0, "end": 120, "lines": [{"who": "Shourya", "text": "Okay, quick question before we even start. If you had to cast Lady Macbeth, do you go young or old?"}, {"who": "Andrew", "text": "Old. Easily. Someone who’s been waiting her whole life for this."}, {"who": "Shourya", "text": "See, I’d have said young, and that’s basically the whole episode right there."}, {"who": "Andrew", "text": "(laughs) Should we actually introduce ourselves?"}, {"who": "Shourya", "text": "Probably. Welcome to the show, I’m Shourya."}, {"who": "Andrew", "text": "And I’m Andrew. You’re joining in on the Foul Fair Podcast. Today we’re comparing two film versions of Macbeth: Roman Polanski’s from 1971 and Joel Coen’s The Tragedy of Macbeth from 2021."}, {"who": "Shourya", "text": "And we’re zooming in on one character, Lady Macbeth, and pretty much one scene: Act 1, Scene 5. That’s where she reads Macbeth’s letters about the witches and calls on the spirits to “unsex” her."}, {"who": "Andrew", "text": "Right. And the question we keep coming back to is, do you actually believe her? Does her motivation make sense in each movie?"}, {"who": "Shourya", "text": "Because these two directors make completely different bets. Polanski casts Francesca Annis, who’s in her twenties. She’s young, she’s gorgeous, she looks almost innocent, and she’s manipulating everything behind the scenes"}, {"who": "Andrew", "text": "And Coen casts Frances McDormand, who’s in her sixties. She’s older, colder, and honestly kind of exhausted. Same name, totally different woman."}, {"who": "Shourya", "text": "So we’ll go text first, then each film, then debate about which one fits Shakespeare’s intention better."}, {"who": "Andrew", "text": "Mostly debate."}]}, {"title": "What Shakespeare gives us", "start": 120, "end": 300, "lines": [{"who": "Andrew", "text": "Let’s start with the text. What do we actually learn about her in Act 1, Scene 5?"}, {"who": "Shourya", "text": "Very little about her reasons, to be honest. She gets through the letter, and instead of celebrating, she starts to worry about her husband. In her view, he’s too soft and too decent to grab the crown the quick way."}, {"who": "Andrew", "text": "That’s almost an insult dressed up as praise."}, {"who": "Shourya", "text": "Exactly. In her mind, the killing is already settled. All that’s left to find out is whether he has the stomach for it."}, {"who": "Andrew", "text": "Then word arrives that Duncan will be there that night, and her mind jumps right away to a raven croaking itself hoarse over the king’s deadly arrival at her castle walls. Notice that. Her walls, not their walls."}, {"who": "Shourya", "text": "Oh, nice spot. Then comes the famous part. She begs the spirits to remove everything feminine in her and pack her from head to foot with pure cruelty."}, {"who": "Andrew", "text": "What grabs me is that she has to ask for it. If she’s requesting evil, she can’t be evil yet. Nobody prays for what they already own."}, {"who": "Shourya", "text": "Right, and that matters for this whole episode. Shakespeare shows us the ambition without ever saying where it started. That leaves a hole for each director to fill, and the way they fill it determines whether she convinces us."}, {"who": "Andrew", "text": "They also have to prepare us for Act 5. She starts out pleading for deep darkness to cover the knife, and she ends up walking in her sleep, rubbing at blood that only she can see."}, {"who": "Shourya", "text": "So unless 1.5 shows a small weakness in her, that later collapse comes out of nowhere."}, {"who": "Andrew", "text": "There’s one more moment I want to point out, in Act 2, Scene 2. She admits she’d have done the deed herself, but the sleeping Duncan reminded her too much of her dad. When it comes down to it, she can’t go through with it."}, {"who": "Shourya", "text": "So she isn’t as icy as she hopes to be. Remember that, because the two films handle it in very different ways."}]}, {"title": "Polanski’s Lady Macbeth, 1971", "start": 300, "end": 540, "lines": [{"who": "Shourya", "text": "Let’s begin with Polanski. Right away you see color, along with real castles and real countryside. You get dirt, livestock, and natural sunlight."}, {"who": "Andrew", "text": "You feel like you’re standing in the actual Middle Ages instead of watching a play."}, {"who": "Shourya", "text": "That pays off in 1.5. Annis goes through the letter by herself in a stone room, under gentle, natural light, with animals all around her. She could be any young wife hearing happy news."}, {"who": "Andrew", "text": "That’s the part that stuck with me. The mise-en-scene feels nearly warm and homey, yet she’s talking about killing someone. She tells Macbeth to seem as harmless as a flower while being the snake below it, and here the entire scene is playing that trick."}, {"who": "Shourya", "text": "Hold on, I like that. For Polanski, the setting itself is the innocent flower."}, {"who": "Andrew", "text": "His wide shots help too. They show her moving through this pleasant space, which sharpens the contrast with the dark plans in her head."}, {"who": "Shourya", "text": "Do we buy her, then? I’d say we do, with one condition. Her drive comes across as ambition without experience. She’s too young to understand the price of a murder."}, {"who": "Andrew", "text": "Yeah, when she calls on the spirits, she doesn’t sound like a witch. She sounds like someone giving herself a pep talk."}, {"who": "Shourya", "text": "Which leads to the payoff. Polanski also adds something that isn’t in the play. We actually watch Duncan get killed, and it’s brutal."}, {"who": "Andrew", "text": "Some context here: this film came soon after the murder of Polanski’s wife, Sharon Tate, in 1969. Many critics view the bloodshed through that lens."}, {"who": "Shourya", "text": "Right. So once Annis’s Lady Macbeth faces the reality of their crime, her innocence starts to break. In the sleepwalking scene, she’s like a child who knows she’s ruined something for good."}, {"who": "Andrew", "text": "I’d push back a little, though. At times, that innocence makes her tough to accept in the role. In the play, she proves her resolve by describing how she’d kill her own baby. It’s hard to picture someone this sweet and gentle saying anything so horrifying."}, {"who": "Shourya", "text": "I believe that’s by design. In Polanski’s version, her ambition is bigger than anything she knows about violence. Still, you’re right that her soft look can make it hard to see the commanding schemer Shakespeare created."}]}, {"title": "Coen’s Lady Macbeth, 2021", "start": 540, "end": 780, "lines": [{"who": "Andrew", "text": "All right, I’ll take this one. Visually, Coen goes in the opposite direction. It’s black and white, nearly square in the classic 1.37:1 Academy ratio, and shot completely on soundstages."}, {"who": "Shourya", "text": "The castle barely seems real. It’s closer to a maze of huge concrete corridors."}, {"who": "Andrew", "text": "Right. It’s closer to German Expressionism or live theater. Cinematographer Bruno Delbonnel cuts hard shafts of light through the windows and arches and leaves everything else in darkness."}, {"who": "Shourya", "text": "How does that change Act 1, Scene 5?"}, {"who": "Andrew", "text": "She stands in a bare stone room with hard lines of light cutting across her. Nothing about it feels warm. The space is as chilly as the look on her face."}, {"who": "Shourya", "text": "McDormand doesn’t turn calling on the spirits into a big event either. She stays hushed and nearly blank."}, {"who": "Andrew", "text": "Yes, and this is where age comes in. Coen wanted an older couple, two people down to their final shot. With no kids and nothing ahead of them, the crown is the only thing left."}, {"who": "Shourya", "text": "Which neatly answers what Shakespeare left open. We asked where her ambition comes from, and Coen says the clock is ticking."}, {"who": "Andrew", "text": "Exactly. And that plea to the spirits lands differently when a woman in her sixties says it. She isn’t a girl throwing away her innocence. She’s someone who has lost a great deal and still wants more."}, {"who": "Shourya", "text": "Here’s my issue, though. She has such tight control in 1.5 that when she falls apart later, it nearly catches you off guard."}, {"who": "Andrew", "text": "Seriously? The sleepwalking scene was my favorite part of the film."}, {"who": "Shourya", "text": "It’s a great scene on its own. My problem is how she develops. Annis has visible cracks from the start, while McDormand seems impossible to break until she abruptly comes undone."}, {"who": "Andrew", "text": "I’d say the cracks are already there. She’s keeping it all locked inside, and that harsh lighting mirrors the emptiness of her life. The collapse is just everything she’s been suppressing breaking through."}, {"who": "Shourya", "text": "Okay, that’s fair. I didn’t expect an answer that good."}, {"who": "Andrew", "text": "The speed of the film helps as well. It runs just about an hour and forty-five minutes, so nothing lingers. Her fall comes just as quickly, more like a cliff than a long slide."}]}, {"title": "Head to head: evil, ambition, pacing", "start": 780, "end": 960, "lines": [{"who": "Shourya", "text": "Time to put them side by side. First up is evil. What’s its source in each movie?"}, {"who": "Andrew", "text": "For Polanski, it’s all around. The whole world is filthy, violent, and rotten, and it swallows Lady Macbeth the moment she steps in."}, {"who": "Shourya", "text": "For Coen, evil is a kind of void. The sets are stripped down, the lighting is severe, and she pours her ambition into that nothingness. It feels close to existential."}, {"who": "Andrew", "text": "So in Polanski, evil comes from the outside, and in Coen, it comes from within."}, {"who": "Shourya", "text": "Yes, exactly."}, {"who": "Andrew", "text": "Now for ambition. Polanski’s Lady Macbeth is reaching for years ahead of power, rank, and rule. Coen’s is reaching because she has no years left."}, {"who": "Shourya", "text": "And they’re both saying the same lines, so it’s clearly the filmmaking making the difference, not the text."}, {"who": "Andrew", "text": "The rhythm of each film differs too. Polanski’s runs past the two-hour mark and slows down in the middle, but 1.5 gets plenty of space."}, {"who": "Shourya", "text": "That unhurried approach serves her character, since we get to see her transform. Coen’s shorter cut plays like a bad dream, but she gets less time to grow."}, {"who": "Andrew", "text": "So each one gives something up. Coen wins on mood, and Polanski wins on character."}, {"who": "Shourya", "text": "Right. Quick note on costumes: Annis starts out in pale, flowing colors, and McDormand wears heavy, dark, simple cloth. It’s that same contrast again, purity that gets stained against a chill that never left."}]}, {"title": "Verdict and outro", "start": 960, "end": 1050, "lines": [{"who": "Andrew", "text": "Time for the verdict. Which Lady Macbeth do you believe more?"}, {"who": "Shourya", "text": "My vote goes to Polanski. Annis starts high enough to have a real fall. Because 1.5 shows us her innocence, the sleepwalking scene feels earned and hits harder."}, {"who": "Andrew", "text": "I’m picking Coen. McDormand tackles the question Shakespeare never answers, which is why she’s so desperate for this. Time is slipping away from her, and the lighting and bare sets let you sense it."}, {"who": "Shourya", "text": "So we’re split."}, {"who": "Andrew", "text": "And that’s really what this is about. The play leaves a question open, and each director answers it through casting, light, and location."}, {"who": "Shourya", "text": "If you haven’t seen either one, pick Coen for the look and Polanski for Lady Macbeth’s arc. Better yet, see both and play their versions of 1.5 one after the other."}, {"who": "Andrew", "text": "We did exactly that, and it proves how far a director can take identical lines."}, {"who": "Shourya", "text": "That’s all from us. I’m Shourya."}, {"who": "Andrew", "text": "And I’m Andrew. Thanks for listening to the Foul Fair Podcast."}]}];
const LEAD_IN = 3;
const TOTAL = SECTIONS[SECTIONS.length - 1].end;

const $ = id => document.getElementById(id);
const stage = $('stage'), script = $('script'), body = $('body'), head = $('head');
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

const store = {
  get(k, d) { try { const v = localStorage.getItem('prompter-' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('prompter-' + k, v); } catch (e) {} }
};

// Build the script
const lines = [], heads = [];
SECTIONS.forEach((sec, i) => {
  const h = document.createElement('div');
  h.className = 'section-head';
  const title = document.createElement('h2');
  title.textContent = sec.title;
  const time = document.createElement('span');
  time.textContent = fmt(sec.start) + ' to ' + fmt(sec.end);
  h.append(title, time);
  body.append(h);
  heads.push(h);

  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = fmt(sec.start) + '  ' + sec.title;
  $('section').append(opt);

  sec.lines.forEach(l => {
    const row = document.createElement('div');
    row.className = 'line ' + l.who.toLowerCase();
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = l.who;
    const text = document.createElement('div');
    text.className = 'text';
    const m = l.text.match(/^(\(laughs\))(.*)$/);
    if (m) {
      const em = document.createElement('em');
      em.textContent = m[1];
      text.append(em, m[2]);
    } else {
      text.textContent = l.text;
    }
    row.append(who, text);
    body.append(row);
    lines.push({ el: row, who: l.who, top: 0 });
  });
});
$('total').textContent = fmt(TOTAL);

// Time drives position: each section fills its scripted minutes.
let anchors = [], readY = 0, expected = 0;
let t = -LEAD_IN, playing = false, last = 0, current = -1;

function topOf(el) {
  return el.getBoundingClientRect().top - stage.getBoundingClientRect().top + stage.scrollTop;
}
function measure() {
  const h = stage.clientHeight;
  readY = h * 0.3;
  script.style.paddingTop = Math.max(0, readY - head.offsetHeight) + 'px';
  script.style.paddingBottom = h + 'px';
  anchors = SECTIONS.map((s, i) => ({ t: s.start, y: topOf(heads[i]) - readY }));
  const lastLine = lines[lines.length - 1].el;
  anchors.push({ t: TOTAL, y: topOf(lastLine) + lastLine.offsetHeight - readY });
  lines.forEach(l => { l.top = topOf(l.el); });
}
function yAt(time) {
  const c = Math.max(0, Math.min(TOTAL, time));
  for (let i = 1; i < anchors.length; i++) {
    const a = anchors[i - 1], b = anchors[i];
    if (c <= b.t) return a.y + (b.y - a.y) * (c - a.t) / (b.t - a.t);
  }
  return anchors[anchors.length - 1].y;
}
function tAt(y) {
  if (y <= anchors[0].y) return 0;
  for (let i = 1; i < anchors.length; i++) {
    const a = anchors[i - 1], b = anchors[i];
    if (y <= b.y) return a.t + (b.t - a.t) * (y - a.y) / (b.y - a.y);
  }
  return TOTAL;
}
function paint() {
  stage.scrollTop = yAt(t);
  expected = stage.scrollTop;
  status();
}
function status() {
  $('clock').textContent = t < 0 ? 'Starts in ' + Math.ceil(-t) : fmt(t);
  const y = stage.scrollTop + readY + 4;
  let n = 0;
  for (let i = 0; i < lines.length; i++) { if (lines[i].top <= y) n = i; else break; }
  if (n !== current) {
    if (current >= 0) lines[current].el.classList.remove('now');
    lines[n].el.classList.add('now');
    current = n;
    const who = lines[n].who;
    $('speaker').textContent = who;
    $('speaker').className = who.toLowerCase();
    $('mark').className = who.toLowerCase();
  }
  let s = 0;
  SECTIONS.forEach((sec, i) => { if (t >= sec.start) s = i; });
  if ($('section').selectedIndex !== s) $('section').selectedIndex = s;
}

// Playback
let wake = null;
async function holdScreen() {
  try { if (playing && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }
  catch (e) { wake = null; }
}
function letScreenGo() {
  if (wake) { wake.release().catch(() => {}); wake = null; }
}
function setPlaying(on) {
  playing = on;
  $('play').textContent = on ? 'Pause' : 'Play';
  last = 0;
  if (on) { holdScreen(); requestAnimationFrame(frame); } else { letScreenGo(); }
}
function frame(now) {
  if (!playing) return;
  if (last) {
    const dt = Math.min((now - last) / 1000, 0.1);
    t += t < 0 ? dt : dt * speed;
    if (t >= TOTAL) { t = TOTAL; paint(); setPlaying(false); return; }
    paint();
  }
  last = now;
  requestAnimationFrame(frame);
}
function jump(time) { t = time; paint(); }

// Manual scrolling moves the clock with it
let scrollShare = 0;
stage.addEventListener('scroll', () => {
  if (Math.abs(stage.scrollTop - expected) > 3) {
    t = tAt(stage.scrollTop);
    expected = stage.scrollTop;
    status();
    clearTimeout(scrollShare);
    scrollShare = setTimeout(share, 300);
  }
}, { passive: true });

// Controls
let speed = 1;
const clampSpeed = pct => Math.max(10, Math.min(300, pct));
function setSpeed(pct) {
  speed = pct / 100;
  $('speed').value = pct;
  if (document.activeElement !== $('speedOut')) $('speedOut').value = pct;
  store.set('speed', pct);
}
function setSize(px) {
  const size = Math.max(18, Math.min(48, px));
  document.documentElement.style.setProperty('--size', size + 'px');
  store.set('size', size);
  measure();
  paint();
}
function currentSize() {
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--size'), 10);
}
function setFocus(who) {
  script.dataset.focus = who;
  $('focus').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.focus === who));
  store.set('focus', who);
}
function toggle() {
  if (t >= TOTAL) jump(-LEAD_IN);
  setPlaying(!playing);
}

$('play').addEventListener('click', () => { toggle(); share(); });
$('restart').addEventListener('click', () => { jump(-LEAD_IN); if (!playing) setPlaying(true); share(); });
$('speed').addEventListener('input', e => { setSpeed(Number(e.target.value)); share(); });
$('speedOut').addEventListener('change', e => {
  const typed = Math.round(Number(e.target.value));
  if (e.target.value !== '' && typed > 0) {
    setSpeed(clampSpeed(typed));
    share();
  }
  e.target.value = Math.round(speed * 100);
});
$('speedOut').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('smaller').addEventListener('click', () => setSize(currentSize() - 2));
$('larger').addEventListener('click', () => setSize(currentSize() + 2));
$('focus').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFocus(b.dataset.focus); });
$('section').addEventListener('change', e => { jump(SECTIONS[e.target.value].start); share(); });
body.addEventListener('click', e => {
  const row = e.target.closest('.line');
  if (!row || String(getSelection())) return;
  jump(tAt(topOf(row) - readY));
  share();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, button')) return;
  if (e.key === ' ') { e.preventDefault(); toggle(); share(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); setSpeed(clampSpeed(Math.round(speed * 100) + 5)); share(); }
  if (e.key === 'ArrowDown') { e.preventDefault(); setSpeed(clampSpeed(Math.round(speed * 100) - 5)); share(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { wake = null; holdScreen(); }
});
new ResizeObserver(() => { measure(); paint(); }).observe(stage);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { measure(); paint(); });

// Sync: playback state travels through public MQTT relays. Only numbers are sent, never the script.
const BROKERS = window.PROMPTER_BROKERS || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
const deviceId = Math.random().toString(36).slice(2, 10);
const STALE_AFTER = 20;
let room = null, clients = [], seenRev = 0, seenId = '', leader = false, tick = 0;
const peers = new Map();
const topic = name => 'foul-fair-prompter/v1/' + room + '/' + name;

function publish(name, data, retain) {
  const msg = JSON.stringify(data);
  clients.forEach(c => { if (c.connected) c.publish(topic(name), msg, { qos: 0, retain }); });
}
function snapshot() {
  seenRev += 1;
  seenId = deviceId;
  return { id: deviceId, rev: seenRev, speed: Math.round(speed * 100), playing, t, at: Date.now() };
}
function share() {
  if (!room) return;
  leader = true;
  publish('state', snapshot(), true);
}
function receive(m, retained) {
  if (m.id === deviceId || !Number.isFinite(m.rev) || !Number.isFinite(m.t) || !Number.isFinite(m.speed)) return;
  if (m.rev < seenRev || (m.rev === seenRev && m.id <= seenId)) return;
  seenRev = m.rev;
  seenId = m.id;
  const heartbeat = m.hb === true;
  if (!heartbeat) leader = false;
  setSpeed(clampSpeed(Math.round(m.speed)));
  const age = Math.max(0, (Date.now() - m.at) / 1000);
  const abandoned = retained && age > STALE_AFTER;
  const on = m.playing === true && !abandoned;
  let target = Math.max(-LEAD_IN, Math.min(TOTAL, m.t));
  if (on) target += (retained ? age : 0.1) * (target < 0 ? 1 : speed);
  if (!heartbeat || Math.abs(target - t) > 1) jump(target);
  if (on !== playing) setPlaying(on);
}
function syncState(text, connected) {
  $('syncStatus').textContent = text;
  $('sync').classList.toggle('on', Boolean(connected));
  $('sync').textContent = connected ? 'Synced' : 'Sync';
}
function refreshStatus() {
  if (!room) return syncState('Not synced.', false);
  const up = clients.some(c => c.connected);
  const now = Date.now();
  peers.forEach((seen, id) => { if (now - seen > 11000) peers.delete(id); });
  if (!up) syncState('Connecting to the sync service…', false);
  else if (peers.size === 0) syncState('Room ' + room + ' is open. Waiting for the other device.', false);
  else syncState('Synced with ' + peers.size + (peers.size === 1 ? ' other device.' : ' other devices.'), true);
}
function leaveRoom() {
  clearInterval(tick);
  clients.forEach(c => c.end(true));
  clients = [];
  room = null;
  leader = false;
  seenRev = 0;
  seenId = '';
  peers.clear();
  $('leave').hidden = true;
  $('copyLink').hidden = true;
  store.set('room', '');
  refreshStatus();
}
function joinRoom(code) {
  const clean = code.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  if (clean.length < 3) return syncState('Use a code with at least 3 letters or numbers.', false);
  if (room) leaveRoom();
  if (!window.mqtt) return syncState('Sync could not load. Refresh the page and try again.', false);
  room = clean;
  $('roomCode').value = room;
  $('leave').hidden = false;
  $('copyLink').hidden = false;
  store.set('room', room);
  clients = BROKERS.map(url => {
    const c = mqtt.connect(url, { clientId: 'ffp-' + deviceId + Math.random().toString(36).slice(2, 6), reconnectPeriod: 3000, connectTimeout: 8000 });
    c.on('connect', () => {
      c.subscribe([topic('state'), topic('hello')], { qos: 0 });
      publish('hello', { id: deviceId }, false);
      refreshStatus();
    });
    c.on('close', refreshStatus);
    c.on('error', () => {});
    c.on('message', (name, payload, packet) => {
      let m;
      try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || typeof m !== 'object') return;
      if (name.endsWith('/hello')) {
        if (m.id && m.id !== deviceId) {
          if (!peers.has(String(m.id))) publish('hello', { id: deviceId }, false);
          peers.set(String(m.id), Date.now());
          refreshStatus();
        }
      } else {
        receive(m, packet.retain === true);
      }
    });
    return c;
  });
  // Nothing in the room yet: this device sets the starting state.
  const joined = room;
  setTimeout(() => { if (room === joined && seenRev === 0) share(); }, 2000);
  tick = setInterval(() => {
    publish('hello', { id: deviceId }, false);
    if (leader && playing && !document.hidden) publish('state', { ...snapshot(), hb: true }, true);
    refreshStatus();
  }, 4000);
  refreshStatus();
}

function openPanel(open) {
  $('syncPanel').hidden = !open;
  $('sync').setAttribute('aria-expanded', open);
  if (open && !room) {
    if (!$('roomCode').value) $('roomCode').value = store.get('room', '') || Math.random().toString(36).slice(2, 6).toUpperCase();
    $('roomCode').focus();
  }
}
$('sync').addEventListener('click', () => openPanel($('syncPanel').hidden));
$('closeSync').addEventListener('click', () => openPanel(false));
$('syncForm').addEventListener('submit', e => { e.preventDefault(); joinRoom($('roomCode').value); });
$('leave').addEventListener('click', leaveRoom);
$('copyLink').addEventListener('click', async () => {
  const link = location.origin + location.pathname + '?room=' + room;
  try { await navigator.clipboard.writeText(link); $('copyLink').textContent = 'Copied'; }
  catch (e) { $('roomCode').value = link; $('roomCode').select(); }
  setTimeout(() => { $('copyLink').textContent = 'Copy link'; }, 1500);
});

// Start
const linkedRoom = new URLSearchParams(location.search).get('room');
setSpeed(Number(store.get('speed', 100)) || 100);
setFocus(store.get('focus', 'both'));
setSize(Number(store.get('size', 0)) || (innerWidth < 640 ? 24 : 32));
if (linkedRoom) { setPlaying(false); openPanel(true); joinRoom(linkedRoom); }
else setPlaying(!matchMedia('(prefers-reduced-motion: reduce)').matches);
</script>
</body>
</html>
